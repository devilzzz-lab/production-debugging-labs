name: Artifact Missing Demo

# on:
#   workflow_dispatch:           # This allows you to trigger the workflow manually from the GitHub Actions tab in your repository.
#                                # It won't run automatically on every push to the main branch.


on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Application
        run: |
          echo "Simulating build..."
          mkdir -p dist
          echo "Hello World" > dist/app.txt

      # ❌ INTENTIONALLY NOT uploading artifact
      # - name: Upload Artifact
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: app-build
      #     path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: app-build   # ❌ This will fail (artifact doesn't exist)

      - name: Deploy Step
        run: echo "Deploying application..."