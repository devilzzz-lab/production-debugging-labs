name: Artifact Missing Demo

on:                          # 👉 This allows manual trigger from GitHub Actions tab
  workflow_dispatch:         # 👉 Disabled now (using push trigger instead)
                        
# on:
#   push:
#     branches:
#       - main   # 👉 Runs automatically on push to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4   # ✅ Updated to latest version

      - name: Build Application
        run: |
          echo "Simulating build..."
          mkdir -p dist
          echo "Hello World" > dist/app.txt

      # ❌ INTENTIONALLY NOT uploading artifact
      # 👉 This is the root cause of failure
      # 👉 Deploy stage will expect artifact, but it won't exist
      #
      # - name: Upload Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-build
      #     path: dist/

  deploy:
    needs: build   # ✅ Ensures build runs first
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4   # ✅ FIXED (v3 deprecated)
        with:
          name: app-build   # ❌ This artifact does not exist

      - name: Deploy Step
        run: echo "Deploying application..."