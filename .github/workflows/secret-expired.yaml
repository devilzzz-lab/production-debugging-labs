name: Secret Expiration Demo

# on:                          # Comment Out the push trigger to avoid running this workflow on every push 
#   push:
#     branches:                   
#       - main

on:
  workflow_dispatch:           # This allows you to trigger the workflow manually from the GitHub Actions tab in your repository.
                               # It won't run automatically on every push to the main branch.

jobs:
  secret-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker (Simulated Expired Token)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Dummy Step
        run: echo "This will not run if login fails"