apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
  - name: memory-hog
    image: polinux/stress
    command: ["stress"]
    args:
      - "--vm"
      - "1"
      - "--vm-bytes"
      - "200M"
      - "--vm-hang"
      - "1"
    resources:
      limits:
        memory: "50Mi"
        cpu: "500m"
      requests:
        memory: "25Mi"
        cpu: "250m"