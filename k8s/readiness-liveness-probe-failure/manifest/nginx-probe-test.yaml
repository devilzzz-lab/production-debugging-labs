apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-probe-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-probe
  template:
    metadata:
      labels:
        app: nginx-probe
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        readinessProbe:
          httpGet:
            path: /healthz   # ❌ Wrong path
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 9999   # ❌ Wrong port
          initialDelaySeconds: 10
          periodSeconds: 5